# Dedicated signing config for this personal, sideloaded app.
# Committed on purpose so every CI build produces the SAME signature,
# which is what lets new APKs install over an already-installed version.
# This is not secret-grade security. If you ever publish this app or care
# about key secrecy, move these values to GitHub Actions secrets and
# regenerate the keystore.
storeFile=keystore/commute-tracker.jks
storePassword=commute123
keyAlias=commute
keyPassword=commute123
